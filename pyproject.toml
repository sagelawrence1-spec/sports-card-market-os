[project]
name = "sports-card-market-os"
version = "0.7.4"
requires-python = ">=3.11"
dependencies = [
  "python-dateutil>=2.8",
  "requests>=2.31",
]

[project.scripts]
opportunity-radar-feed = "opportunity_feed_cli:main"
opportunity-live-manifest = "opportunity_live_manifest:main"
opportunity-repricing-collect = "opportunity_repricing_cli:main"
opportunity-repricing-apply = "opportunity_repricing_apply:main"
opportunity-repricing-manifest = "opportunity_repricing_manifest_cli:main"
opportunity-repricing-batch = "opportunity_repricing_batch_cli:main"
opportunity-decision-packet = "opportunity_decision_packet:main"
opportunity-decision-batch = "opportunity_decision_batch_cli:main"
opportunity-decision-persist = "opportunity_decision_persist:main"
opportunity-research-run = "opportunity_research_run:main"
opportunity-outcome-manifest = "opportunity_outcome_manifest_cli:main"
opportunity-outcome-run = "opportunity_outcome_manifest_run_cli:main"
product-research-receipt = "product_research_receipt:main"
product-research-corpus-proof = "product_research_corpus_proof:main"
public-ebay-corpus-report = "public_ebay_corpus:main"
evidence-readiness = "evidence_readiness:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["providers"]
py-modules = ["allocation_audit", "benchmark_cost_resolver", "benchmark_journal", "benchmark_outcome_integrity", "benchmark_runtime", "bulk_ingest", "calibration_decision", "calibration_safety", "capital_allocation", "comparable_lift", "comparable_selection", "corpus_intake", "corpus_proof", "data_provider", "delta_engine", "detectors", "ebay_ingest", "engine", "entity_matcher", "entity_resolution_gate", "entity_resolution_metrics", "evidence_readiness", "evidence_store", "evidence_to_warehouse", "feature_engineering", "grader", "import_bundle", "intelligence_benchmark", "market_contract", "market_engine", "market_history", "market_pipeline", "market_runner", "memory", "models", "observed_cost_context", "opportunity_attention", "opportunity_decision_batch", "opportunity_decision_batch_cli", "opportunity_decision_ledger", "opportunity_decision_packet", "opportunity_decision_persist", "opportunity_engine", "opportunity_feed", "opportunity_feed_cli", "opportunity_ledger", "opportunity_live_manifest", "opportunity_outcome_batch", "opportunity_outcome_collection", "opportunity_outcome_manifest", "opportunity_outcome_manifest_cli", "opportunity_outcome_manifest_run", "opportunity_outcome_manifest_run_cli", "opportunity_outcomes", "opportunity_pricing", "opportunity_radar", "opportunity_report", "opportunity_repricing_apply", "opportunity_repricing_batch", "opportunity_repricing_batch_cli", "opportunity_repricing_cli", "opportunity_repricing_collection", "opportunity_repricing_manifest", "opportunity_repricing_manifest_cli", "opportunity_repricing_plan", "opportunity_research_run", "opportunity_scan_delta", "opportunity_scorecard", "portfolio_exposure", "product_research_corpus_proof", "product_research_receipt", "public_ebay_corpus", "recommendation_journal", "recommendation_outcomes", "reconstruction", "reconstruction_history", "registry_expansion", "routing_accuracy", "routing_audit", "routing_corpus_manifest", "scan", "scoring", "warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
