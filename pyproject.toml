[project]
name = "sports-card-market-os"
version = "0.7.4"
requires-python = ">=3.11"
dependencies = [
  "python-dateutil>=2.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["allocation_audit", "benchmark_cost_resolver", "benchmark_journal", "benchmark_runtime", "bulk_ingest", "calibration_safety", "capital_allocation", "corpus_intake", "corpus_proof", "data_provider", "delta_engine", "detectors", "ebay_ingest", "engine", "entity_matcher", "entity_resolution_gate", "entity_resolution_metrics", "evidence_store", "evidence_to_warehouse", "feature_engineering", "grader", "import_bundle", "intelligence_benchmark", "market_contract", "market_engine", "market_pipeline", "market_runner", "memory", "models", "observed_cost_context", "portfolio_exposure", "recommendation_journal", "reconstruction", "registry_expansion", "routing_accuracy", "routing_audit", "routing_corpus_manifest", "scan", "scoring", "warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"