[project]
name = "sports-card-market-os"
version = "0.7.4"
requires-python = ">=3.11"
dependencies = [
  "python-dateutil>=2.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["benchmark_journal", "bulk_ingest", "calibration_safety", "capital_allocation", "data_provider", "delta_engine", "detectors", "ebay_ingest", "engine", "entity_matcher", "evidence_store", "evidence_to_warehouse", "feature_engineering", "grader", "import_bundle", "intelligence_benchmark", "market_contract", "market_engine", "market_pipeline", "market_runner", "memory", "models", "portfolio_exposure", "recommendation_journal", "scan", "scoring", "warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
