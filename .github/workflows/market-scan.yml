name: Scheduled market evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  scan-and-build:
    if: ${{ vars.MARKET_SCAN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_SOLD_PROVIDER: ${{ vars.MARKET_SOLD_PROVIDER || 'sold_comps' }}
      SOLD_COMPS_API_KEY: ${{ secrets.SOLD_COMPS_API_KEY }}
      SOLD_COMPS_EBAY_SITE: ${{ vars.SOLD_COMPS_EBAY_SITE || 'ebay.com' }}
      SOLD_COMPS_MAX_QUERIES_PER_RUN: ${{ vars.SOLD_COMPS_MAX_QUERIES_PER_RUN || '3' }}
      THE_CARD_API_KEY: ${{ secrets.THE_CARD_API_KEY }}
      THE_CARD_API_PLAN: ${{ vars.THE_CARD_API_PLAN }}
      THE_CARD_API_PLATFORMS: ${{ vars.THE_CARD_API_PLATFORMS }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US
      EBAY_MARKETPLACE_INSIGHTS_ENABLED: ${{ vars.EBAY_MARKETPLACE_INSIGHTS_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python market_runner.py --database market_state.sqlite --output alpha-web/public/data/market-scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-scan-${{ github.run_id }}
          path: alpha-web/public/data/market-scan.json
          if-no-files-found: error
          retention-days: 14
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: alpha-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: alpha-web
      - run: pnpm build:pages
        working-directory: alpha-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: alpha-web/pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: scan-and-build
    steps:
      - name: Deploy refreshed market evidence
        id: deployment
        uses: actions/deploy-pages@v4
