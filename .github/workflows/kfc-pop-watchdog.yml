name: KFC PSA POP Watchdog

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/gemrate_pop_watchdog.py"
      - ".github/workflows/kfc-pop-watchdog.yml"
  schedule:
    # 12:17pm Phoenix / 3:17pm US Eastern, after GemRate's usual update
    - cron: "17 19 * * *"

permissions:
  contents: write

concurrency:
  group: kfc-pop-watchdog-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Read GemRate public report for all seven cards
        run: python scripts/gemrate_pop_watchdog.py
      - name: Save validated snapshots
        run: |
          git config user.name "pop-watchdog"
          git config user.email "pop-watchdog@users.noreply.github.com"
          git add alpha-web/public/psa-pop-watchdog/populations.json
          if git diff --cached --quiet; then
            echo "Public source unchanged; no snapshot commit needed."
            exit 0
          fi
          git commit -m "Update KFC PSA population observations"
          git pull --rebase origin main
          git push origin HEAD:main
